<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Platform</title>

    <!-- ============================================== -->
    <!-- מקום להוספת שמות קבצים / עמודים נוספים באתר   -->
    <!-- הוסף כאן קישורים לעמודים נוספים (למשל: about.html, settings.html, admin.html) -->
    <!-- דוגמה: <link rel="prefetch" href="about.html"> -->
    <!-- ============================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-primary: #050b14;
            --bg-secondary: #0a1223;
            --bg-card: rgba(17, 34, 64, 0.75);
            --bg-input: rgba(13, 25, 48, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #e6f1ff;
            --text-secondary: #8892b0;
            --accent: #64ffda;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --success: #00e676;
            --danger: #ff5252;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --radius: 16px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 50% 0%, #0f1c3f 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ========== HEADER ========== */
        .app-header {
            width: 100%;
            background: rgba(10, 18, 35, 0.92);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(14px);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bot-avatar {
            position: relative;
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #112240, #0d1b33);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(100, 255, 218, 0.25);
            box-shadow: 0 0 12px rgba(100, 255, 218, 0.15);
        }

        .bot-avatar i {
            font-size: 20px;
            color: var(--accent);
        }

        .status-dot {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.9); }
        }

        .header-titles h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-titles p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ========== MAIN CHAT AREA ========== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
        }

        /* Welcome state */
        .welcome-container {
            max-width: 580px;
            margin: auto;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .welcome-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e6f1ff, #64ffda);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-card > p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #ccd6f6;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-item i {
            color: var(--accent);
            font-size: 14px;
            width: 18px;
            text-align: center;
        }

        /* Messages */
        .message {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: messageIn 0.35s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
        }

        .message.bot .message-avatar {
            background: linear-gradient(145deg, #112240, #0d1b33);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: var(--accent);
        }

        .message.user .message-avatar {
            background: linear-gradient(145deg, #1e3a5f, #152a45);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
        }

        .message-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            max-width: calc(100% - 50px);
            line-height: 1.55;
            font-size: 14.5px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #1e3a5f 0%, #152a45 100%);
            border-color: rgba(59, 130, 246, 0.25);
        }

        .message-bubble img.preview {
            max-width: 220px;
            border-radius: 10px;
            margin-top: 8px;
            display: block;
        }

        .message-bubble .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .message-bubble .file-chip i {
            color: var(--accent-blue);
        }

        /* Thinking / Loading animation */
        .thinking-container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: messageIn 0.3s ease;
        }

        .thinking-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 220px;
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .thinking-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .thinking-step {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .thinking-step.active {
            opacity: 1;
            color: var(--text-primary);
        }

        .thinking-step.done {
            opacity: 0.85;
            color: var(--success);
        }

        .thinking-step i {
            width: 14px;
            font-size: 11px;
        }

        /* ========== FOOTER / INPUT ========== */
        .chat-footer {
            padding: 12px 16px 8px;
            flex-shrink: 0;
            background: linear-gradient(to top, rgba(5, 11, 20, 0.95) 60%, transparent);
        }

        .chat-input-wrapper {
            max-width: 780px;
            margin: 0 auto;
            position: relative;
        }

        /* Attachments preview */
        .attachments-preview {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px 10px;
        }

        .attachments-preview.has-items {
            display: flex;
        }

        .attachment-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 13px;
            max-width: 200px;
        }

        .attachment-chip img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 6px;
        }

        .attachment-chip .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .attachment-chip .remove {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px;
            font-size: 12px;
            transition: color 0.15s;
        }

        .attachment-chip .remove:hover {
            color: var(--danger);
        }

        .chat-input-container {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 10px 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input-container:focus-within {
            border-color: rgba(59, 130, 246, 0.45);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12), var(--shadow);
        }

        .input-actions-left {
            display: flex;
            gap: 2px;
            padding-bottom: 2px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            padding: 10px 6px;
            resize: none;
            max-height: 140px;
            line-height: 1.45;
            text-align: right;
            direction: rtl;
        }

        .chat-input::placeholder {
            color: #5a6b8a;
        }

        .send-btn {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 16px;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn.loading {
            pointer-events: none;
        }

        .send-btn.loading i {
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hidden file inputs */
        .hidden-input {
            display: none;
        }

        /* Footer copyright */
        .footer-copyright {
            text-align: center;
            font-size: 11px;
            color: #4a5a75;
            padding: 6px 0 10px;
        }

        /* Module selector (placeholder for future) */
        .module-selector {
            display: none; /* יופעל בעתיד */
            padding: 0 4px 8px;
        }

        .module-selector select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .feature-grid {
                grid-template-columns: 1fr;
            }
            .app-header {
                padding: 10px 14px;
            }
            .welcome-card {
                padding: 20px;
            }
            .message-bubble {
                max-width: calc(100% - 44px);
            }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="header-right">
            <div class="bot-avatar">
                <i class="fa-solid fa-robot"></i>
                <div class="status-dot" title="מחובר"></div>
            </div>
            <div class="header-titles">
                <h1>AI Agent Platform</h1>
                <p>פלטפורמת סוכני בינה מלאכותית לארגונים</p>
            </div>
        </div>
        <div class="header-left">
            <!-- מקום לכפתורים נוספים / ניווט לעמודים -->
            <button class="header-btn" title="הגדרות" id="btn-settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="header-btn" title="שיחה חדשה" id="btn-new-chat">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- ========== CHAT MESSAGES AREA ========== -->
    <main class="chat-area" id="chat-area">
        <!-- Welcome screen (מוצג בהתחלה) -->
        <div class="welcome-container" id="welcome-container">
            <div class="welcome-card">
                <h2>העוזר הדיגיטלי של הארגון שלכם</h2>
                <p>שאלו שאלה, צרפו קובץ או תמונה וקבלו ניתוח, סיכום ותשובה מיידית מבוססת בינה מלאכותית.</p>
                <div class="feature-grid">
                    <div class="feature-item">
                        <i class="fa-solid fa-file-lines"></i>
                        <span>ניתוח קבצים ומסמכים</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-image"></i>
                        <span>ניתוח תמונות</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>סיכום ותובנות</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-bolt"></i>
                        <span>מענה בזמן אמת</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- הודעות יופיעו כאן דינמית -->
    </main>

    <!-- ========== FOOTER / INPUT ========== -->
    <footer class="chat-footer">
        <div class="chat-input-wrapper">

            <!-- בחירת מודול (מוכן לעתיד) -->
            <div class="module-selector" id="module-selector">
                <select id="module-select">
                    <option value="general">מודול כללי</option>
                    <option value="documents">ניתוח מסמכים</option>
                    <option value="images">ניתוח תמונות</option>
                    <option value="code">עזרה בקוד</option>
                </select>
            </div>

            <!-- תצוגה מקדימה של קבצים מצורפים -->
            <div class="attachments-preview" id="attachments-preview"></div>

            <div class="chat-input-container">
                <div class="input-actions-left">
                    <button class="action-btn" id="btn-attach-file" title="צרף קובץ">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <button class="action-btn" id="btn-attach-image" title="העלה תמונה">
                        <i class="fa-regular fa-image"></i>
                    </button>
                </div>

                <textarea
                    class="chat-input"
                    id="chat-input"
                    placeholder="כתבו הודעה..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button class="send-btn" id="btn-send" title="שלח" disabled>
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>

        <div class="footer-copyright">
            AI Agent Platform &copy; — כל הזכויות שמורות
        </div>
    </footer>

    <!-- Hidden file inputs -->
    <input type="file" id="file-input" class="hidden-input" accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.json,.md">
    <input type="file" id="image-input" class="hidden-input" accept="image/*" multiple>

    <!-- ============================================== -->
    <!-- סקריפטים - סדר חשוב: קודם agent, אחר כך chat  -->
    <!-- ============================================== -->
    <script src="agent.js"></script>
    <script src="chat.js"></script>
</body>
</html>
